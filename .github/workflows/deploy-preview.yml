name: Deploy Preview

on:
  pull_request:
    branches: [master, main]
    types: [opened, synchronize, reopened]

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  preview:
    name: Build & Comment Preview
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test -- --run

      - name: Build
        run: NODE_ENV=production npm run build
        env:
          NEXT_PUBLIC_SITE_URL: http://localhost:3000

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: preview-build-${{ github.event.pull_request.number }}
          path: .next/
          retention-days: 1

      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const body = `## ✅ Preview Build Ready

            **PR #${{ github.event.pull_request.number }}** passed all checks:

            | Check | Status |
            |---|---|
            | Typecheck | ✅ Passed |
            | Tests | ✅ Passed |
            | Production build | ✅ Succeeded |

            **Files changed:** \`${{ github.event.pull_request.changed_files }}\`
            **Additions:** +${{ github.event.pull_request.additions }} / **Deletions:** -${{ github.event.pull_request.deletions }}

            > Deploy to VPS to see a live preview. Merge to \`master\` triggers production deploy.
            `;

            // Find and update existing comment, or create new one
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('Preview Build Ready')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
