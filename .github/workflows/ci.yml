name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  # ── Typecheck + Lint ──────────────────────────────────────
  check:
    name: Typecheck & Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Validate datasets
        run: npm run pipeline:validate

  # ── Tests ─────────────────────────────────────────────────
  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: dwellgauge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U testuser"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://testuser:testpass@localhost:5432/dwellgauge_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run migrations
        run: |
          for migration in db/migrations/*.sql; do
            psql "$DATABASE_URL" -f "$migration" 2>/dev/null || true
          done
        env:
          PGPASSWORD: testpass

      - name: Run tests
        run: npm test -- --run

  # ── Build verification ────────────────────────────────────
  build:
    name: Production Build
    runs-on: ubuntu-latest
    needs: [check, test]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build production bundle
        run: NODE_ENV=production npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://dwellgauge.com

      - name: Verify build output
        run: |
          test -d .next/server && echo "Build output exists"
          test -f .next/BUILD_ID && echo "BUILD_ID present"
          echo "Build ID: $(cat .next/BUILD_ID)"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-build
          path: .next/
          retention-days: 3

  # ── Lighthouse (optional, runs on PRs only) ───────────────
  lighthouse:
    name: Lighthouse Audit
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: [build]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build
        run: NODE_ENV=production npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://dwellgauge.com

      - name: Run Lighthouse
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            http://localhost:3000/
            http://localhost:3000/costs
            http://localhost:3000/licenses
          configPath: .lighthouserc.json
          uploadArtifacts: true
        env:
          LHCI_BUILD_CONTEXT__CURRENT_HASH: ${{ github.event.pull_request.head.sha || github.sha }}
