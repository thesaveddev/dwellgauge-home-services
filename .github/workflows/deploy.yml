name: Deploy to Production

on:
  push:
    branches: [master, main]
    paths:
      - "src/**"
      - "db/**"
      - "data/**"
      - "scripts/**"
      - "next.config.ts"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "postcss.config.mjs"
      - "Dockerfile"
      - "docker-compose.yml"

  workflow_dispatch:
    inputs:
      skip_tests:
        description: "Skip test suite (emergency deploy)"
        required: false
        default: false
        type: boolean

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  NODE_VERSION: "22"
  VPS_HOST: ${{ secrets.VPS_HOST }}
  VPS_USER: ${{ secrets.VPS_USER }}
  APP_DIR: /var/www/dwellgauge

jobs:
  # ── Pre-deploy checks ────────────────────────────────────
  precheck:
    name: Pre-deploy checks
    runs-on: ubuntu-latest
    if: ${{ !inputs.skip_tests }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test -- --run

  # ── Deploy to VPS via Docker ──────────────────────────────
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: [precheck]
    if: always() && (needs.precheck.result == 'success' || inputs.skip_tests)
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ env.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Sync source code to VPS
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            --exclude='node_modules' \
            --exclude='.next' \
            --exclude='.env' \
            --exclude='.env.local' \
            --exclude='.git' \
            --exclude='data files/' \
            --exclude='*.log' \
            --exclude='.dockerignore' \
            ./ ${{ env.VPS_USER }}@${{ env.VPS_HOST }}:${{ env.APP_DIR }}/

      - name: Deploy with Docker Compose
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ${{ env.VPS_USER }}@${{ env.VPS_HOST }} << 'DEPLOY_SCRIPT'
            set -euo pipefail
            cd /var/www/dwellgauge

            echo "=> Pulling latest code..."
            git pull origin master 2>/dev/null || true

            echo "=> Building Docker images..."
            docker compose build --no-cache

            echo "=> Rolling restart..."
            docker compose up -d --remove-orphans

            echo "=> Waiting for healthy..."
            for i in $(seq 1 20); do
              if curl -sf http://localhost/api/health 2>/dev/null | grep -q '"ok":true'; then
                echo "=> App is healthy"
                break
              fi
              sleep 3
            done

            echo "=> Health check..."
            HEALTH=$(curl -sf http://localhost/api/health 2>/dev/null || echo '{"ok":false}')
            echo "$HEALTH"

            if echo "$HEALTH" | grep -q '"ok":true'; then
              echo "✅ Deploy successful"
            else
              echo "⚠️  Checking logs..."
              docker compose logs app --tail 20
              exit 1
            fi
          DEPLOY_SCRIPT

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key

  # ── Post-deploy verification ─────────────────────────────
  verify:
    name: Post-deploy verification
    runs-on: ubuntu-latest
    needs: [deploy]
    steps:
      - name: Wait for deployment to stabilize
        run: sleep 20

      - name: Verify production health
        run: |
          HEALTH=$(curl -sf http://${{ env.VPS_HOST }}/api/health 2>/dev/null || echo '{"ok":false}')
          echo "Health: $HEALTH"
          if echo "$HEALTH" | grep -q '"ok":true'; then
            echo "✅ Production verified"
          else
            echo "❌ Production health check failed"
            exit 1
          fi

      - name: Verify key pages
        run: |
          for path in / /costs /licenses /about /robots.txt /sitemap.xml; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "http://${{ env.VPS_HOST }}${path}" 2>/dev/null || echo "000")
            if [[ "$STATUS" == "200" ]]; then
              echo "✅ $path → $STATUS"
            else
              echo "❌ $path → $STATUS"
            fi
          done
