# Gitleaks configuration for DwellGauge
# Extends default ruleset, adds allowlist for non-secret values used in deploy scripts.

title = "DwellGauge secret scanning"

[extend]
# Start from the built-in default rules
useDefault = true

[allowlist]
description = "Allowlisted patterns that are not real secrets"

# VPS IP address used in deployment scripts (public endpoint, not a secret)
regexes = [
  '''158\.69\.221\.87''',
]

# Deploy bootstrap files contain placeholder passwords, not real secrets
paths = [
  '''deploy/.*\.sh''',
  '''deploy/.*\.conf''',
  '''\.env\.production''',
  '''\.env\.example''',
  '''deploy/DEPLOY\.md''',
  '''scripts/import-florida-postgres\.ts''',
  '''scripts/sync-licenses-fl\.ts''',
]
