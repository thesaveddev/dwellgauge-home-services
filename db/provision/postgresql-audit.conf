# Append to postgresql.conf, then reload or restart PostgreSQL.
# Requires the pgaudit extension installed on the server (Ubuntu:
# apt install postgresql-16-pgaudit, then `create extension pgaudit;`).

# Log every connection attempt (helps detect unauthorized access).
log_connections = on
log_disconnections = on

# Log administrative and role/schema/DDL statements plus audit table writes.
shared_preload_libraries = 'pgaudit'
pgaudit.log = 'write, role, ddl'
pgaudit.log_catalog = off
pgaudit.log_client = off
pgaudit.log_level = 'log'
pgaudit.log_parameter = on
pgaudit.log_relation = on
pgaudit.log_statement_once = off

# Durable, rotated logs.
logging_collector = on
log_directory = 'log'
log_filename = 'postgresql-%a.log'
log_truncate_on_rotation = on
log_rotation_age = 1d
log_rotation_size = 100MB

# Include timestamps and connection origin for every audit line.
log_line_prefix = '%m [%p] %q%u@%d %a '
