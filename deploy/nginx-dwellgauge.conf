# DwellGauge Nginx Configuration
# Place in /etc/nginx/sites-available/dwellgauge
# Symlink to /etc/nginx/sites-enabled/

# Rate limiting zone
limit_req_zone $binary_remote_addr zone=dwellgauge:10m rate=30r/s;
limit_req_status 429;

upstream dwellgauge {
    server 127.0.0.1:3000;
    keepalive 32;
}

# ── HTTP → HTTPS redirect (enable after SSL) ────────────────
server {
    listen 80;
    listen [::]:80;
    server_name dwellgauge.com www.dwellgauge.com;

    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS (enable after certbot) ────────────────────────────
# Uncomment this block after running:
#   sudo certbot --nginx -d dwellgauge.com -d www.dwellgauge.com
#
# server {
#     listen 443 ssl http2;
#     listen [::]:443 ssl http2;
#     server_name dwellgauge.com www.dwellgauge.com;
#
#     ssl_certificate /etc/letsencrypt/live/dwellgauge.com/fullchain.pem;
#     ssl_certificate_key /etc/letsencrypt/live/dwellgauge.com/privkey.pem;
#     ssl_protocols TLSv1.2 TLSv1.3;
#     ssl_ciphers HIGH:!aNULL:!MD5;
#     ssl_prefer_server_ciphers on;
#
#     include /etc/nginx/sites-available/dwellgauge-ssl-params.conf;
#     # or inline the SSL params below
# }

# ── Main server block ───────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name dwellgauge.com www.dwellgauge.com _;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:;" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/json application/javascript application/xml
        application/rss+xml application/atom+xml
        image/svg+xml;

    # Static assets — aggressive cache
    location /_next/static/ {
        proxy_pass http://dwellgauge;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    # Favicon, icons
    location ~* \.(ico|svg|png|webp|jpg|jpeg|gif)$ {
        proxy_pass http://dwellgauge;
        expires 30d;
        add_header Cache-Control "public";
    }

    # Health endpoint — no rate limit
    location /api/health {
        proxy_pass http://dwellgauge;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Admin — stricter rate limit
    location /admin {
        limit_req zone=dwellgauge burst=5 nodelay;
        proxy_pass http://dwellgauge;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API endpoints — moderate rate limit
    location /api/ {
        limit_req zone=dwellgauge burst=20 nodelay;
        proxy_pass http://dwellgauge;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # All other routes
    location / {
        limit_req zone=dwellgauge burst=50 nodelay;
        proxy_pass http://dwellgauge;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_buffering on;
        proxy_buffer_size 8k;
        proxy_buffers 8 8k;
    }

    # Block common attack paths
    location ~* \.(env|git|svn|htaccess|htpasswd)$ {
        return 404;
    }

    location ~* wp-admin|wp-login|xmlrpc {
        return 404;
    }
}
